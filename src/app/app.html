<a class="skip-link" href="#main">Skip to content</a>

<nav class="topnav" aria-label="Primary">
  <span class="brand">
    <img src="logo.png" alt="Sahm" class="logo logo-light" width="72" height="24" />
    <img src="logo2.png" alt="Sahm" class="logo logo-dark" width="72" height="24" />
    <span class="brand-sep" aria-hidden="true"></span>
    <span class="brand-sub">POS</span>
  </span>
  <a routerLink="/orders" routerLinkActive="active" ariaCurrentWhenActive="page">Live Orders</a>
  <a routerLink="/search" routerLinkActive="active" ariaCurrentWhenActive="page">Search</a>
  <span class="nav-grow"></span>
  <button
    type="button"
    class="theme-toggle"
    (click)="toggleTheme()"
    [attr.aria-label]="theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'"
  >
    {{ theme() === 'light' ? '🌙' : '☀️' }}
  </button>
</nav>

<main id="main">
  <router-outlet />
</main>
