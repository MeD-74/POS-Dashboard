name: Deploy to GitHub Pages

# Builds the Angular app and publishes it to GitHub Pages on every push to main.
# Live URL after the first successful run:
#   https://med-74.github.io/POS-Dashboard/
# Requires: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build (GitHub Pages sub-path)
        run: npx ng build --base-href /POS-Dashboard/

      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/sahm-pos/browser/index.html dist/sahm-pos/browser/404.html
          touch dist/sahm-pos/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sahm-pos/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
